name: Build Windows Executable

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          python -m nuitka --onefile --windows-disable-console --assume-yes-for-downloads --include-data-dir=src/web=web --output-dir=dist --output-filename=TrustmeAntivirus.exe src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrustmeAntivirus
          path: dist/TrustmeAntivirus.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrustmeAntivirus.exe
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}